[build]
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python -m gunicorn mainProject.wsgi:application --bind 0.0.0.0:$PORT --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
