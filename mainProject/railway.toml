[build]
buildCommand = "python3 -m pip install -r requirements.txt"

[deploy]
startCommand = "python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && python3 -m gunicorn mainProject.wsgi --bind 0.0.0.0:$PORT --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10